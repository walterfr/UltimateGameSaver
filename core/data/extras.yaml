# content/<perfil>/<TitleID>/00000001 = saves (00000002 = DLC, 000B0000 = updates)
Xenia:
  exe: [xenia.exe, xenia_canary.exe]
  files:
    "<base>/content/*/*/00000001": {tags: [save]}
    "<winDocuments>/Xenia/content/*/*/00000001": {tags: [save]}

mGBA:
  exe: [mGBA.exe, mgba-qt]
  files:
    "<base>/saves": {tags: [save]}
  configDirs:
    "<base>/config.ini": &mgba_keys
      savegamePath: ["*.sav"]
      savestatePath: ["*.ss*"]
    "<winAppData>/mGBA/config.ini": *mgba_keys
    "<xdgConfig>/mgba/config.ini": *mgba_keys
  sidecar:
    roms: [gba, gb, gbc, sgb]
    saves: [sav, ss0, ss1, ss2, ss3, ss4, ss5, ss6, ss7, ss8, ss9]

melonDS:
  exe: [melonDS.exe, melonDS]
  configDirs:
    "<base>/melonDS.toml": &melonds_keys
      SaveFilePath: ["*.sav"]
      SavestatePath: ["*.ml*"]
    "<base>/melonDS.ini": *melonds_keys
    "<winAppData>/melonDS/melonDS.toml": *melonds_keys
    "<xdgConfig>/melonDS/melonDS.toml": *melonds_keys
  sidecar:
    roms: [nds, dsi]
    saves: [sav, ml1, ml2, ml3, ml4, ml5, ml6, ml7, ml8]

Vita3K:
  exe: [Vita3K.exe, Vita3K]
  files:
    "<base>/ux0/user/00/savedata": {tags: [save]}
    "<winAppData>/Vita3K/Vita3K/ux0/user/00/savedata": {tags: [save]}
    "<xdgData>/Vita3K/Vita3K/ux0/user/00/savedata": {tags: [save]}
  configDirs:
