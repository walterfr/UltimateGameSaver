# Regras próprias, no formato do manifesto do Ludusavi, aplicadas por cima dele.
#
# - files:      se presente, SUBSTITUI os files da entrada do manifesto (ids/installDir/launch ficam)
# - exe:        caminho do executável relativo a <base>; achado nas pastas raiz (`ugs root add`)
# - configDirs: arquivo de config -> chave -> padrões dentro da pasta que a chave aponta
#               (valor ":\x" = relativo ao arquivo de config, "default"/vazio = ignorado)
# - sidecar:    saves com o mesmo nome da ROM, na mesma pasta, achados nas pastas raiz
#
# Só saves e states — nada de cache, shaders, texturas, firmware ou jogos instalados.

RetroArch:
  exe: [retroarch.exe, retroarch]
  files:
    "<base>/saves": {tags: [save]}
    "<base>/states": {tags: [state]}
    "C:/RetroArch-Win64/saves": {tags: [save]}
    "C:/RetroArch-Win64/states": {tags: [state]}
    "<winAppData>/RetroArch/saves": {tags: [save]}
    "<winAppData>/RetroArch/states": {tags: [state]}
    "<xdgConfig>/retroarch/saves": {tags: [save]}
    "<xdgConfig>/retroarch/states": {tags: [state]}
    "<home>/.var/app/org.libretro.RetroArch/config/retroarch/saves": {tags: [save]}
    "<home>/.var/app/org.libretro.RetroArch/config/retroarch/states": {tags: [state]}
  configDirs:
    "<base>/retroarch.cfg": &ra_keys
      savefile_directory: ["**/*.srm", "**/*.sav", "**/*.mcd", "**/*.mcr", "**/*.rtc", "**/*.eep", "**/*.sra", "**/*.fla", "**/*.mpk", "**/*.dsv", "**/*.bkr", "**/*.bcr", "**/*.brm"]
      savestate_directory: ["**/*.state*"]
    "C:/RetroArch-Win64/retroarch.cfg": *ra_keys
    "<winAppData>/RetroArch/retroarch.cfg": *ra_keys
    "<xdgConfig>/retroarch/retroarch.cfg": *ra_keys
    "<home>/.var/app/org.libretro.RetroArch/config/retroarch/retroarch.cfg": *ra_keys

Dolphin:
  exe: [Dolphin.exe, dolphin-emu]
  files:
    # GC = memory cards (GCI ou .raw); Wii/title/00010000 = saves de jogos de disco
    "<base>/User/GC": {tags: [save]}
    "<base>/User/Wii/title/00010000": {tags: [save]}
    "<base>/User/StateSaves": {tags: [state]}
    "<winDocuments>/Dolphin Emulator/GC": {tags: [save]}
    "<winDocuments>/Dolphin Emulator/Wii/title/00010000": {tags: [save]}
    "<winDocuments>/Dolphin Emulator/StateSaves": {tags: [state]}
    "<winAppData>/Dolphin Emulator/GC": {tags: [save]}
    "<winAppData>/Dolphin Emulator/Wii/title/00010000": {tags: [save]}
    "<winAppData>/Dolphin Emulator/StateSaves": {tags: [state]}
    "<xdgData>/dolphin-emu/GC": {tags: [save]}
    "<xdgData>/dolphin-emu/Wii/title/00010000": {tags: [save]}
    "<xdgData>/dolphin-emu/StateSaves": {tags: [state]}
    "<home>/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/GC": {tags: [save]}
    "<home>/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/Wii/title/00010000": {tags: [save]}
    "<home>/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/StateSaves": {tags: [state]}

