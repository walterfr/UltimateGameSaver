    "<base>/user/sdmc/Nintendo 3DS/*/*/extdata": {tags: [save]}
    "<base>/user/states": {tags: [state]}
    "<winAppData>/Azahar/sdmc/Nintendo 3DS/*/*/title/*/*/data": {tags: [save]}
    "<winAppData>/Azahar/sdmc/Nintendo 3DS/*/*/extdata": {tags: [save]}
    "<winAppData>/Azahar/states": {tags: [state]}
    "<xdgData>/azahar-emu/sdmc/Nintendo 3DS/*/*/title/*/*/data": {tags: [save]}
    "<xdgData>/azahar-emu/sdmc/Nintendo 3DS/*/*/extdata": {tags: [save]}
    "<xdgData>/azahar-emu/states": {tags: [state]}

