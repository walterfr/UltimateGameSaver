[package]
name = "ugs-core"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
dirs = "5"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sysinfo = "0.33"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
