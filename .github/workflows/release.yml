name: Release

# Ao publicar uma release no GitHub, gera os instaladores e anexa a ela.
# Para refazer os anexos de uma release existente: Actions → Release → Run workflow → tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 22.04: glibc mais antiga, o AppImage roda em mais distros
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file
      - name: Build dos instaladores
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build
      - name: Anexar à release
        shell: bash
        run: |
          mkdir out
          for f in target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] && cp "$f" "out/$(basename "$f" | sed 's/Ultimate Game Saver/UltimateGameSaver/')"
          done
          ls -l out
          gh release upload "$TAG" out/* --clobber
